services:
  grafeo:
    build:
      context: ..
      dockerfile: grafeo-server/Dockerfile
    image: grafeodb/grafeo-server:latest
    ports:
      - "7474:7474"
    volumes:
      - grafeo-data:/data
    environment:
      - GRAFEO_SESSION_TTL=300
      # The image listens on 0.0.0.0, so it refuses to start without credentials:
      # set GRAFEO_AUTH_TOKEN, or GRAFEO_AUTH_USER and GRAFEO_AUTH_PASSWORD, in .env
      # (an unset value is forwarded empty, and empty is not a credential), or set
      # GRAFEO_ALLOW_UNAUTHENTICATED=true for a trusted network only.
      - GRAFEO_AUTH_TOKEN=${GRAFEO_AUTH_TOKEN:-}
      - GRAFEO_AUTH_USER=${GRAFEO_AUTH_USER:-}
      - GRAFEO_AUTH_PASSWORD=${GRAFEO_AUTH_PASSWORD:-}
    restart: unless-stopped

volumes:
  grafeo-data:
