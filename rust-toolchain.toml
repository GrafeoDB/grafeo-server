# Pinned so local builds and CI use the same compiler and clippy lint set.
# Bump deliberately (and fix new lints in the same change) instead of tracking `stable`.
# Keep this identical to the `dtolnay/rust-toolchain@<version>` refs in .github/workflows.
# The MSRV (rust-version in Cargo.toml) is 1.99.0 too since 0.6.0 (grafeo 0.6 needs it),
# checked separately with `cargo +1.99.0`; the Docker builder image stays on the MSRV
# and never sees this file (Dockerfile.dockerignore).

[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
